name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: npm run check
      - name: Prepare disposable service configuration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path config -Force | Out-Null
          '{"version":1,"projects":[]}' | Set-Content -Path config/projects.json -Encoding utf8NoBOM
      - name: Run project tests
        run: npm test
